[project]
name = "interview-agent"
version = "0.1.0"
description = "면접 지원 서비스의 Agent(AI) 서버: 사전 리포트, 실시간 전사, 꼬리질문, 평가, 보고서"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.5",
    "uvicorn==0.54.0",
    "websockets==17.4",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "langchain-core==1.8.0",
    "langgraph==1.2.21",
    "langchain-openai==1.7.4",
    "httpx==0.28.1",
    "redis==8.1.0",
    "PyYAML==6.0.3",
    "numpy==2.5.4",
    "PyJWT==2.15.1",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.5.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
